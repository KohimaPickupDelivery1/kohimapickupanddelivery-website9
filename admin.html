<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPD Admin</title><link rel="stylesheet" href="/style.css"></head><body><main class="section"><div class="section-head"><span class="eyebrow">KPD ADMIN</span><h1>Order dashboard</h1><p>Manage quotes, statuses, payments and driver assignment.</p></div><div id="login" class="card form" style="max-width:480px"><input id="password" type="password" placeholder="Admin password"><button class="btn primary" onclick="login()">Sign in</button><div id="msg"></div></div><div id="dash" class="hidden"><div class="card" id="orders"></div></div></main><script>
let key='';async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const j=await r.json();if(!r.ok){msg.textContent=j.error;return}key=j.key;document.getElementById('login').classList.add('hidden');dash.classList.remove('hidden');load()}
async function load(){const r=await fetch('/api/admin/orders',{headers:{'x-admin-key':key}});const os=await r.json();orders.innerHTML='<h2>Orders ('+os.length+')</h2>'+os.map(o=>`<div class="card" style="margin:12px 0"><b>${o.id}</b> · ${o.customer.name} · ${o.customer.phone}<p>${o.pickup} → ${o.drop}<br>${o.packageType}</p><div class="grid two"><select id="s-${o.id}"><option ${o.status==='Quote requested'?'selected':''}>Quote requested</option><option ${o.status==='Quote sent'?'selected':''}>Quote sent</option><option ${o.status==='Confirmed'?'selected':''}>Confirmed</option><option ${o.status==='Picked up'?'selected':''}>Picked up</option><option ${o.status==='Out for delivery'?'selected':''}>Out for delivery</option><option ${o.status==='Delivered'?'selected':''}>Delivered</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select><input id="q-${o.id}" value="${o.quote??''}" placeholder="Quote ₹" type="number"></div><button class="btn primary" style="margin-top:10px" onclick="save('${o.id}')">Save update</button></div>`).join('')||'<p>No orders yet.</p>'}
async function save(id){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({status:document.getElementById('s-'+id).value,quote:document.getElementById('q-'+id).value})});load()}
</script></body></html>
